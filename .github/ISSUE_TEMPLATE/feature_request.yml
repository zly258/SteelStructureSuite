name: 功能建议
description: 提议新的构件类型、参数或功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的参数、构造与交互方式
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: 相关标准依据（若有）
      description: 请注明标准号与标准全称，例如 NB/T 47041《塔式容器》
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
